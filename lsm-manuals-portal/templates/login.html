{% extends "base.html" %}{% block title %}الدخول{% endblock %}
{% block content %}
<div class="loginbox">
  <div style="font-size:34px;color:var(--gold)">⬢</div>
  <h1>شركة سوق المال الليبي</h1>
  <div class="sub">منظومة أدلة الإجراءات الداخلية — الدخول للموظفين المخولين فقط</div>
  <form method="post">
    <label class="f">اسم المستخدم<input name="username" required autofocus></label>
    <label class="f">كلمة المرور<input name="password" type="password" required></label>
    <button class="btn navy" type="submit">دخول</button>
  </form>
</div>
{% endblock %}
