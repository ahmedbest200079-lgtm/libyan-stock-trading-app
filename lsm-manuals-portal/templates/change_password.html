{% extends "base.html" %}{% block title %}تغيير كلمة المرور{% endblock %}
{% block content %}
<h1 class="page">تغيير كلمة المرور</h1>
<div class="card" style="max-width:460px">
  <form method="post" style="display:flex;flex-direction:column;gap:12px">
    <label class="f">كلمة المرور الحالية<input type="password" name="old" required></label>
    <label class="f">كلمة المرور الجديدة (8 أحرف فأكثر)<input type="password" name="new" minlength="8" required></label>
    <button class="btn navy">حفظ</button>
  </form>
</div>
{% endblock %}
