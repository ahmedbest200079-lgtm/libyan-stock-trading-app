; ═══════════════════════════════════════════════════════════════════════════
;  إعداد وحدة الربط بقاعدة بيانات نظام التداول — سوق المال الليبي
;  الملف يُعبّأ من فريق تقنية المعلومات بالتنسيق مع مسؤول قاعدة البيانات / المورّد.
;  المسارات النسبية تُحسب من موقع هذا الملف.
;  اختبار الإعداد:   python lsm_db_feeder.py --config db_feeder.ini --test
; ═══════════════════════════════════════════════════════════════════════════

[database]
; النوع: sqlserver | oracle | postgresql | mysql | odbc | sqlite
type = sqlite
; ── للتجربة: قاعدة SQLite تُنشأ بالأمر  --make-demo-db demo.sqlite
path = demo.sqlite

; ── SQL Server (مثال) ──
; type = sqlserver
; host = 10.0.0.25
; port = 1433
; database = TradingDB
; odbc_driver = ODBC Driver 18 for SQL Server
; extra = Encrypt=yes;TrustServerCertificate=yes

; ── Oracle (مثال) ──
; type = oracle
; host = 10.0.0.25
; port = 1521
; service_name = TRADING

; حساب القراءة فقط — كلمة المرور في متغير بيئة (لا تُكتب هنا):
;   setx LSM_DB_PASSWORD "..."   (ويندوز، مرة واحدة)
user =
password_env = LSM_DB_PASSWORD
timeout = 15

[queries]
; استعلام SELECT واحد لكل بند — يُرفض أي أمر غير SELECT.
; يُفضّل أن ينشئ مسؤول القاعدة جدول عرض (View) — انظر docs/db/*.sql
stocks = SELECT * FROM LSM_DISPLAY_V
index  = SELECT * FROM LSM_INDEX_V

[columns]
; اسم العمود في نتيجة الاستعلام لكل حقل. اتركها فارغة للتعرف الآلي على الأسماء الشائعة
; (SYMBOL, PREV_CLOSE, OPEN_PRICE, HIGH_PRICE, LOW_PRICE, LAST_PRICE, VOLUME, TRADE_VALUE, TRADES, BEST_BID, BEST_ASK ...)
sym    =
prev   =
open   =
high   =
low    =
last   =
vol    =
val    =
trades =
bid    =
ask    =
shares =
mcap   =

[index_columns]
; INDEX_VALUE, INDEX_PREV, INDEX_HIGH, INDEX_LOW, SESSION_DATE تُعرف آليًا
value =
prev  =
high  =
low   =
date  =

[schedule]
; أيام التداول وساعات الجلسة
days = sun,mon,tue,wed,thu
open = 10:00
close = 13:00
; القراءة تبدأ قبل الافتتاح وتستمر بعد الإقفال (دقائق)
pre_minutes = 15
post_minutes = 30
; فترة القراءة أثناء الجلسة (ثوانٍ)
interval = 15
; إعادة كتابة الملف دوريًا حتى لو لم تتغير الأرقام (لكي لا تُنبّه الشاشة بتوقف التحديث)
heartbeat_seconds = 60
idle_check_minutes = 10
holidays_file = ../data/holidays.json

[output]
session = ../data/session.json
companies = ../data/companies.json
archive_dir = ../data/archive
status_file = ../data/feeder_status.json
log_file = ../data/logs/db_feeder.log

[alerts]
; تنبيه بالبريد عند توقف التغذية أثناء الجلسة أو ظهور فروق في المطابقة
enabled = false
smtp_host =
smtp_port = 587
smtp_tls = true
smtp_user =
smtp_password_env = LSM_SMTP_PASSWORD
from =
; عدة عناوين مفصولة بفاصلة
to =
; بعد كم دقيقة من الانقطاع يُرسل التنبيه
stale_minutes = 5
; أقل مدة بين تكرار التنبيه نفسه
repeat_minutes = 60
